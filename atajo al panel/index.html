<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiron Technology - Servicios Integrales</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --bg-base: #0f172a;
            --text-light: #f8fafc;
            --text-dark: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --whatsapp: #25D366;
            --telegram: #0088cc;
            --btn-hero-gradient: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #1e40af 0%, transparent 60%);
            color: var(--text-light); padding: 15px; display: flex; justify-content: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-base); display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-left-color: #60a5fa;
            border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .splash-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #60a5fa; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            max-width: 450px; width: 100%; background: rgba(15, 23, 42, 0.6); border-radius: 20px;
            padding: 20px 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid var(--border-color);
            opacity: 0; transition: opacity 0.5s ease-in;
        }
        .main-container.visible { opacity: 1; }

        /* --- SECCIÓN HERO --- */
        .hero-section { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 25px; }
        .hero-title-curve { font-size: 14px; font-weight: 900; color: #94a3b8; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; }
        .hero-logo {
            width: 90px; height: 90px; background-color: #1e3a8a; border-radius: 50%; display: flex; justify-content: center;
            align-items: center; border: 3px solid #60a5fa; margin-bottom: 20px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); overflow: hidden;
        }
        .hero-logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.6s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .hero-pill {
            display: flex; align-items: center; background: var(--btn-hero-gradient); color: var(--text-dark);
            width: 100%; padding: 12px 15px; border-radius: 50px; margin-bottom: 12px; text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 -2px 5px rgba(0,0,0,0.1); text-align: left;
            cursor: pointer; border: none; transition: transform 0.1s;
        }
        .hero-pill:active { transform: scale(0.97); }
        .hero-pill-icon { font-size: 24px; margin-right: 15px; background: #cbd5e1; padding: 8px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .hero-pill-text h3 { font-size: 13px; font-weight: 800; margin-bottom: 2px; line-height: 1.1; }
        .hero-pill-text p { font-size: 11px; color: #475569; font-weight: 600; }

        /* --- BUSCADOR --- */
        .search-container { margin-bottom: 15px; position: relative; }
        .search-input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 10px; border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.8); color: white; font-size: 14px; outline: none; transition: border 0.3s;
        }
        .search-input:focus { border-color: #60a5fa; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        /* --- SECCIÓN HERRAMIENTAS --- */
        .section-title { color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; margin-top: 15px; text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .grid-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        
        .card-tool {
            background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color);
            display: flex; flex-direction: column; text-align: center; text-decoration: none; color: inherit; 
            cursor: pointer; transition: transform 0.2s, opacity 0.3s;
        }
        .card-tool:active { transform: scale(0.95); }
        .tool-img { height: 60px; display: flex; justify-content: center; align-items: center; color: white; overflow: hidden; padding: 5px; }
        .tool-img img { max-width: 90%; max-height: 100%; object-fit: contain; }
        .tool-title { padding: 8px 5px; font-weight: 800; font-size: 12px; color: #ffffff; background: #1e293b; border-top: 1px solid var(--border-color); }

        .card-sigma .tool-img { background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); }
        .card-tfm .tool-img { background: #111827; }
        .card-octoplus .tool-img { background: #0f3b4d; }
        .card-unlock .tool-img { background: #ffffff; }
        .card-pandora .tool-img { background: #2563eb; }
        .card-samstool .tool-img { background: #16a34a; }

        /* --- CONTACTO Y FLOTANTE --- */
        .action-btn { display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-bottom: 10px; color: white; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-tg { background-color: var(--telegram); }
        .icon { margin-right: 8px; font-size: 18px; }

        .floating-wsp {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background-color: var(--whatsapp); border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); z-index: 1000; text-decoration: none;
            animation: float 3s ease-in-out infinite;
        }
        .floating-wsp span { font-size: 32px; color: white; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

        /* --- BOTTOM SHEET (PANEL DESLIZANTE DE SERVICIOS) --- */
        .bottom-sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
            z-index: 10000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .bottom-sheet-overlay.active { opacity: 1; visibility: visible; }

        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; max-height: 85vh;
            background: #1e293b; border-top-left-radius: 20px; border-top-right-radius: 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1);
            display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; border-bottom: 1px solid var(--border-color);
            background: #0f172a; border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .sheet-title { font-size: 16px; font-weight: 800; color: white; }
        .sheet-close { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        
        .sheet-search {
            padding: 10px 20px; background: #1e293b;
        }
        .sheet-search input {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: white; outline: none;
        }

        .sheet-content {
            padding: 15px 20px; overflow-y: auto; flex-grow: 1;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        
        .service-item {
            background: #334155; padding: 12px 10px; border-radius: 8px;
            font-size: 12px; font-weight: 600; color: #e2e8f0;
            text-decoration: none; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #475569;
        }
        .service-item:active { background: #475569; }
        .service-check { color: #4ade80; font-weight: bold; }

    </style>
</head>
<body>

    </div>

    <div class="main-container" id="main-content">

        <div class="section-title reveal">Soporte y Contacto</div>
        <a href="https://t.me/JTBSOMOTILLO" target="_blank" class="action-btn btn-tg reveal">

    <a href="https://wa.me/50587241362?text=Hola,%20quiero%20solicitar%20una%20cotizaci%C3%B3n" target="_blank" class="floating-wsp">

    <!-- PANEL DESLIZANTE (BOTTOM SHEET) PARA LOS SERVICIOS -->
    <div class="bottom-sheet-overlay" id="sheetOverlay" onclick="cerrarBottomSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <div class="sheet-title" id="sheetTitle">Servicios</div>
                <button class="sheet-close" onclick="cerrarBottomSheet()">×</button>
            </div>
            <!-- Buscador interno del panel -->
            <div class="sheet-search">
                <input type="text" id="sheetSearchInput" placeholder="Filtrar servicio..." onkeyup="filtrarServicios()">
            </div>
            <!-- Lista de servicios que se llena con JavaScript -->
            <div class="sheet-content" id="sheetContent">
                <!-- Aquí se inyectan los servicios -->
            </div>
        </div>
    </div>

    <script>
        // 1. Pantalla de Carga
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('main-content').classList.add('visible');
            }, 1500); 
        });

        // 2. Animación Scroll
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        revealElements.forEach(el => revealObserver.observe(el));

        // 3. Buscador de herramientas principal
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const texto = e.target.value.toLowerCase();
            const tarjetas = document.querySelectorAll('.card-tool');
            tarjetas.forEach(tarjeta => {
                const nombre = tarjeta.getAttribute('data-nombre');
                if (nombre.includes(texto)) {
                    tarjeta.style.display = 'flex';
                    setTimeout(() => tarjeta.style.opacity = '1', 10);
                } else {
                    tarjeta.style.opacity = '0';
                    setTimeout(() => tarjeta.style.display = 'none', 300);
                }
            });
        });

        // 4. LÓGICA DEL PANEL DE SERVICIOS (BOTTOM SHEET)
        // Aquí están todas las listas que me enviaste en las fotos.
        const listasServicios = {
            'IMEI Servicios': [
                "Brother USB Redirector", "FENIX TOOL", "HFZ Activator MDM Premium iOS27", 
                "FRP Xiaomi Credits", "FRPFILE MDM Bypass Tool all iPhone, iPad", 
                "Motorola Unlock Code (Direct Source)", "Rent's (Digital Tools) Id_Password Instant", 
                "ShellTool Licenses", "MOTOROLA DISH CODE", "NCK Unlock Code", 
                "Samsung JDM Unlock [All]", "Ultra auth Tool", "iHello HFZ (Hello - Passcode) A12/A13",
                "Frpfile Ramdisk A12/A13 Hello Not Change SN", "GLOBAL AUTH TOOL", "SN Services-[Apple BT, Wifi]",
                "MOTO-M Tool", "FRPFILE Ramdisk for A12/A13 Bypass", "FLASH FRP MI INSTAN",
                "HFZ Ramdisk A12/A13 Bypass Passcode SOLO MACBOOK", "Samsung Tool | CellTool"
            ],
            'Servidor Servicios': [
                "Apple Checkers & GSX", "Gsm Theme [Official Reseller]", "HTC FRP FAST 1 MINUTE", 
                "Youtube Premium", "HTC FRP FAST", "Xiaomi Repair Tool XRT", "UnlockTool Activation - Official Reseller",
                "Dragon Serpent Ramdisk V.1", "Adam Tool", "US CELLULAR POLICY UNLOCK",
                "AlseerY-UnLocker", "HFZ T2 (iBridge 10.4 Full Untethered)", "Perseus KG Bypass",
                "Ameer Tool (Official Distributor)", "NO REGISTRO COLOMBIA", "Android AUTH TOOL",
                "Android Multi Tool (AMT) - INSTANT", "AT&T USA NETWORK - DIRECT SOURCE",
                "Android Root Tool [ART]", "A13+ BYPASS EASY"
            ],
            'Remoto Servicios': [
                "PROMO A12+ Bypass Windows", "Anonymous Xiaomi Tool - Official Distributor",
                "T-Mobile/Sprint USA — iPhone — Premium S2", "AnonySHU", "Samsung FRP By imei / Serial",
                "Apizu Tool [ Credit Refill ]", "Auth Flash Pro [ AFT PRO ]", "HFZ IWATCH RAMDISK",
                "HFZ Activator A12+ Windows", "Avatar Auth Tool", "AWT - AndroidWinTool OPEN MENU NO NECESITAS PC",
                "Borneo Activations (3 Months)", "SAMSUNG USA NETWORK", "Borneo Activations (6 Months)",
                "GENERICOS CHECK", "Borneo Activations (12 Months)", "Tecno Infinix itel MDM Remove Permanent",
                "VERIZON USA IPHONE UNLOCK", "Candy Crush", "Xiaomi Mi Account Lock Remove"
            ]
        };

        function abrirBottomSheet(tipo) {
            document.getElementById('sheetTitle').innerText = tipo;
            document.getElementById('sheetSearchInput').value = ''; // Limpiar buscador
            
            const content = document.getElementById('sheetContent');
            content.innerHTML = ''; // Limpiar contenido anterior
            
            const servicios = listasServicios[tipo] || [];
            
            servicios.forEach(servicio => {
                // Cada servicio es un enlace que te manda a Flash-Unlock
                const a = document.createElement('a');
                a.href = 'https://flash-unlock.com/main/login';
                a.target = '_blank';
                a.className = 'service-item';
                a.innerHTML = `<span>${servicio}</span> <span class="service-check">✔</span>`;
                content.appendChild(a);
            });

            document.getElementById('sheetOverlay').classList.add('active');
        }

        function cerrarBottomSheet(event) {
            if (!event || event.target.id === 'sheetOverlay' || event.target.className === 'sheet-close') {
                document.getElementById('sheetOverlay').classList.remove('active');
            }
        }

        // Buscador dentro del Panel de Servicios
        function filtrarServicios() {
            const texto = document.getElementById('sheetSearchInput').value.toLowerCase();
            const items = document.querySelectorAll('.service-item');
            
            items.forEach(item => {
                const nombre = item.querySelector('span').innerText.toLowerCase();
                if (nombre.includes(texto)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // 5. Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW:', err));
            });
        }
    </script>
